[profile.default]
src = "contracts"
test = "test-foundry"
out = "out"
libs = ["node_modules", "lib"]
solc_version = "0.8.17"
optimizer = true
optimizer_runs = 200
auto_detect_remappings = false
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "erc721a/=node_modules/erc721a/",
    "forge-std/=lib/forge-std/src/",
]
